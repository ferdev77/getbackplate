# ─────────────────────────────────────────────────────────────────────────────
# CI Pipeline — SaasResto
#
# Corre en cada PR a main y en cada push a main.
#
# Tres jobs que corren así:
#
#   lint-build ──┐
#                ├──► e2e-smoke  (solo si hay secrets de Supabase)
#   unit-tests ──┘
#
# Para habilitar los E2E smoke tests, agregar en:
#   GitHub → Settings → Secrets and variables → Actions → New repository secret
#
#   Secrets requeridos:
#     NEXT_PUBLIC_SUPABASE_URL        → URL del proyecto Supabase
#     NEXT_PUBLIC_SUPABASE_ANON_KEY   → Anon key pública de Supabase
#     SUPABASE_SERVICE_ROLE_KEY       → Service role key (privada)
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ─── 1. Lint + Build ────────────────────────────────────────────────────────
  lint-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ─── 2. Unit Tests ──────────────────────────────────────────────────────────
  # Tests unitarios de funciones puras — no necesitan variables de entorno
  # ni servicios externos. Siempre corren en paralelo con lint-build.
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Run critical coverage gate
        run: npm run test:critical

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: web/coverage/
          retention-days: 14

  # ─── 3. RLS / Regla de Oro de Alcance ───────────────────────────────────────
  # Verifica contra el proyecto Supabase de DESARROLLO que las politicas RLS
  # cumplen la Regla de Oro (web/README_SCOPE_GOLDEN_RULE.md) en documentos,
  # avisos y checklists: un alcance de solo personas es privado, cumplir una
  # dimension no saltea las otras, y el multi-sucursal llega.
  #
  # Se agrego el 2026-07-29: hasta entonces este runner solo se corria a mano, y
  # por eso avisos y checklists se desviaron de la regla sin que nadie lo notara.
  #
  # El runner crea sus fixtures dentro de una transaccion y hace rollback al
  # terminar, y se niega a correr si detecta el proyecto de produccion.
  rls-scope:
    name: RLS & Scope Golden Rule
    runs-on: ubuntu-latest
    needs: [lint-build, unit-tests]
    defaults:
      run:
        working-directory: web

    env:
      # Ambos deben apuntar al proyecto de DESARROLLO. El runner compara los dos
      # contra el ref esperado y se niega a correr si detecta produccion.
      SUPABASE_DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL_DEV }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_DEV }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check if the dev database secret is configured
        id: check
        env:
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -z "$SUPABASE_DB_POOLER_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            if [ "$IS_FORK_PR" = "true" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::warning::RLS y migraciones no validados: GitHub no entrega secrets a PRs desde forks."
              echo "## RLS NOT VALIDATED" >> "$GITHUB_STEP_SUMMARY"
              echo "PR externo sin acceso a los secrets del proyecto de desarrollo." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "::error::Faltan SUPABASE_DB_POOLER_URL_DEV o NEXT_PUBLIC_SUPABASE_URL_DEV. Una rama interna no puede omitir migraciones/RLS."
            exit 1
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "✓ Secret encontrado — corriendo verificación de RLS y alcance."
          fi

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: npm ci

      - name: Verify dev migration history
        if: steps.check.outputs.skip != 'true'
        run: node scripts/verify-dev-migrations.mjs

      - name: Verify RLS isolation and scope rules
        if: steps.check.outputs.skip != 'true'
        run: node scripts/verify-dev-rls-isolation.mjs

  # ─── 4. E2E Smoke Tests ─────────────────────────────────────────────────────
  # Verifica que todos los endpoints protegidos respondan 401 (no 500).
  # Solo corre cuando lint-build y unit-tests pasan, Y los secrets están configurados.
  # Si los secrets no están, el job lo informa y se saltea limpiamente.
  e2e-smoke:
    name: E2E Smoke (API)
    runs-on: ubuntu-latest
    needs: [lint-build, unit-tests]
    defaults:
      run:
        working-directory: web

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      APP_BASE_URL: http://localhost:3000
      CRON_SECRET: ci-placeholder
      DOCUMENT_WORKER_SECRET: ci-placeholder
      INTEGRATIONS_ENCRYPTION_KEY: ci-placeholder-key-32-chars-minimum
      QBO_OAUTH_STATE_SECRET: ci-placeholder
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check if Supabase secrets are configured
        id: check
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo ""
            echo "⚠️  Supabase secrets no configurados — saltando E2E smoke tests."
            echo "   Para habilitarlos, agregar en GitHub → Settings → Secrets → Actions:"
            echo "     · NEXT_PUBLIC_SUPABASE_URL"
            echo "     · NEXT_PUBLIC_SUPABASE_ANON_KEY"
            echo "     · SUPABASE_SERVICE_ROLE_KEY"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "✓ Supabase secrets encontrados — corriendo E2E smoke tests."
          fi

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: npm ci

      - name: Install Playwright (Chromium)
        if: steps.check.outputs.skip != 'true'
        run: npx playwright install chromium --with-deps

      - name: Run API smoke tests
        if: steps.check.outputs.skip != 'true'
        run: npm run e2e:smoke

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always() && steps.check.outputs.skip != 'true'
        with:
          name: playwright-smoke-report
          path: web/playwright-report/
          retention-days: 14
